# Release builds: run by .github/workflows/release.yml (by hand, never on
# push). Check locally with: goreleaser check, and
# goreleaser release --snapshot --clean --skip=publish
#
# No `brews`: goreleaser deprecated it, and casks have no service block. The
# workflow renders the Homebrew formula from packaging/homebrew/vaquero.rb.tmpl
# and dist/checksums.txt (scripts/formula) and pushes it to the tap.
version: 2

project_name: vaquero

builds:
  - id: vaquero
    main: ./cmd/vaquero
    binary: vaquero
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/stazelabs/vaquero/internal/version.Version={{.Version}}
      - -X github.com/stazelabs/vaquero/internal/version.Commit={{.ShortCommit}}
      - -X github.com/stazelabs/vaquero/internal/version.BuildDate={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github

release:
  github:
    owner: stazelabs
    name: vaquero
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
