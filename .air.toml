root = "."
tmp_dir = "tmp"

[build]
  pre_cmd   = ["make templ", "make css"]
  cmd       = "CGO_ENABLED=0 go build -o bin/vaquero ./cmd/vaquero"
  bin       = "bin/vaquero"
  args_bin  = ["serve"]
  include_ext = ["go", "templ", "css", "js", "sql"]
  exclude_dir = ["bin", "tmp", "data", "node_modules", "docs"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$", "tailwind\\.css$"]
  log = "build-errors.log"
  delay = 300
  kill_delay = "2s"
  send_interrupt = true
