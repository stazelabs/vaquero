# Cuts a release: run by hand from the Actions tab with the tag to create
# (like v0.1.0). Never add push or pull_request triggers. Steps for the
# person releasing are in docs/RELEASING.md.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to create, like v0.1.0"
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tag is a release number
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v0.1.0, got $TAG"; exit 1; }
      - name: Released from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "releases are cut from main; this run is on ${GITHUB_REF}"
          exit 1
      - name: The release's upgrade fixture is committed, at this schema
        env:
          TAG: ${{ inputs.tag }}
        run: |
          json="testdata/upgrade/$TAG.json"
          test -f "testdata/upgrade/$TAG.sqlite" && test -f "$json" || { echo "missing testdata/upgrade/$TAG.sqlite: run make fixture VERSION=${TAG#v} and commit it"; exit 1; }
          newest=$(ls internal/db/migrations | sed -n 's/^0*\([0-9][0-9]*\)_.*/\1/p' | sort -n | tail -1)
          schema=$(sed -n 's/.*"schema": *\([0-9][0-9]*\).*/\1/p' "$json")
          test "$schema" = "$newest" || { echo "$json is at schema $schema but this commit migrates to $newest: delete the unreleased fixture, run make fixture VERSION=${TAG#v} again and commit it"; exit 1; }
  gate:
    needs: check
    uses: ./.github/workflows/quality-gate.yml
  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Create the tag (or reuse it, when re-running a failed release)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            test "$existing" = "$(git rev-parse HEAD)" || { echo "$TAG already exists at another commit; pick a new version"; exit 1; }
            echo "$TAG already points here; reusing it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Vaquero $TAG"
            git push origin "$TAG"
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The formula is rendered from packaging/homebrew/vaquero.rb.tmpl and
      # this release's checksums, then written to the tap through the
      # contents API. A re-run with the same tag updates the file in place,
      # or leaves it alone when it is already this release's. If only this
      # step fails, the formula workflow re-runs it for the existing release.
      - name: Publish the Homebrew formula
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/publish-formula.sh "$TAG" dist/checksums.txt
