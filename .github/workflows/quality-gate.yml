name: quality-gate
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Go tools
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - name: Generated files are fresh
        run: make gen && git diff --exit-code
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: make vet
      - run: make lint
      - run: make test
      - name: Browser tests
        # ubuntu-latest has Google Chrome installed; the variable makes a
        # missing Chrome a failure here rather than a skip.
        env:
          VQ_E2E_REQUIRE_CHROME: "1"
        run: make e2e
      - run: make cover-check
