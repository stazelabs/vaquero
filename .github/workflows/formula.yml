# Writes the Homebrew formula for a release that is already out: run by hand
# from the Actions tab with its tag, when the release workflow's "Publish the
# Homebrew formula" step alone failed (a re-run of the release would fail on
# the existing release). Never add push or pull_request triggers. Steps for
# the person releasing are in docs/RELEASING.md.
name: formula
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The released tag, like v0.1.3"
        required: true
        type: string
permissions:
  contents: read
jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - name: Tag is a release number
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v0.1.0, got $TAG"; exit 1; }
      - name: Run from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "the formula is published from main; this run is on ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # The release's own checksums.txt, and the formula template as it was
      # at the tag, so the formula is the one the release would have written.
      - name: Download the release's checksums
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir dist
          git show "refs/tags/$TAG:packaging/homebrew/vaquero.rb.tmpl" > dist/vaquero.rb.tmpl
      - name: Publish the Homebrew formula
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/publish-formula.sh "$TAG" dist/checksums.txt dist/vaquero.rb.tmpl
